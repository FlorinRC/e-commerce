<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Commerce Shop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }

    header {
      background: #1a1a2e; color: white; padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.5rem; white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    #search {
      padding: 8px 14px; border-radius: 20px; border: none;
      font-size: 0.9rem; width: 220px; outline: none;
    }
    #cart-btn {
      background: #e94560; color: white; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 1rem; white-space: nowrap;
    }

    .filters {
      padding: 16px 32px; display: flex; gap: 8px; flex-wrap: wrap;
      border-bottom: 1px solid #e0e0e0; background: white;
    }
    .filters button {
      padding: 6px 14px; border: 2px solid #1a1a2e; background: white;
      border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .filters button.active, .filters button:hover { background: #1a1a2e; color: white; }

    .sort-bar {
      padding: 12px 32px; display: flex; align-items: center; gap: 10px;
      font-size: 0.9rem; color: #666;
    }
    #sort-select {
      padding: 6px 10px; border: 1.5px solid #ddd; border-radius: 6px;
      font-size: 0.9rem; cursor: pointer;
    }
    #results-count { margin-left: auto; color: #999; font-size: 0.85rem; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px; padding: 16px 32px 40px;
    }
    .no-results { text-align: center; padding: 60px; color: #aaa; font-size: 1.1rem; }

    .card {
      background: white; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); }
    .card-img-wrap { position: relative; overflow: hidden; }
    .card img { width: 100%; height: 180px; object-fit: cover; display: block; transition: transform 0.3s; }
    .card:hover img { transform: scale(1.05); }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .card-category { font-size: 0.75rem; color: #e94560; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
    .card-name { font-size: 1.05rem; font-weight: bold; margin-bottom: 6px; }
    .card-desc { font-size: 0.84rem; color: #666; margin-bottom: 12px; flex: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-price { font-size: 1.15rem; font-weight: bold; color: #1a1a2e; }
    .card-actions { display: flex; gap: 6px; }
    .btn-detail {
      background: white; color: #1a1a2e; border: 2px solid #1a1a2e;
      padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
      text-decoration: none; white-space: nowrap;
    }
    .btn-add {
      background: #e94560; color: white; border: none;
      padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
      transition: background 0.2s; white-space: nowrap;
    }
    .btn-add:hover { background: #c73652; }
    .btn-add.added { background: #27ae60; }

    /* Modal coș */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 100;
      justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 10px; padding: 24px;
      width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
    }
    .modal h2 { margin-bottom: 16px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #eee;
    }
    .cart-item-name { font-weight: bold; font-size: 0.95rem; }
    .cart-item-qty { color: #999; font-size: 0.82rem; }
    .cart-item-price { color: #e94560; font-weight: bold; }
    .btn-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1.1rem; margin-left: 10px; }
    .btn-remove:hover { color: #e94560; }
    .cart-summary { margin-top: 16px; border-top: 2px solid #eee; padding-top: 14px; }
    .cart-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.95rem; }
    .cart-row.total { font-size: 1.1rem; font-weight: bold; margin-top: 6px; }
    .btn-checkout {
      display: block; width: 100%; margin-top: 16px; padding: 12px;
      background: #e94560; color: white; border: none; border-radius: 8px;
      cursor: pointer; font-size: 1rem; font-weight: bold; text-align: center;
      text-decoration: none;
    }
    .btn-close {
      display: block; width: 100%; margin-top: 8px; padding: 10px;
      background: #f0f0f0; color: #333; border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.95rem;
    }
    .empty-cart { text-align: center; color: #aaa; padding: 30px 0; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #27ae60; color: white;
      padding: 12px 20px; border-radius: 8px; font-size: 0.9rem;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>🛒 E-Commerce Shop</h1>
  <div class="header-right">
    <input type="text" id="search" placeholder="Caută produse..." oninput="onSearch()" />
    <button id="cart-btn" onclick="openCart()">Coș (<span id="cart-count">0</span>)</button>
  </div>
</header>

<div class="filters" id="filters">
  <button class="active" data-cat="all" onclick="filterBy('all', this)">Toate</button>
</div>

<div class="sort-bar">
  <label for="sort-select">Sortează:</label>
  <select id="sort-select" onchange="applySort()">
    <option value="default">Implicit</option>
    <option value="price-asc">Preț crescător</option>
    <option value="price-desc">Preț descrescător</option>
    <option value="name-asc">Nume A-Z</option>
  </select>
  <span id="results-count"></span>
</div>

<div class="products-grid" id="products-grid"></div>

<div class="modal-overlay" id="cart-modal">
  <div class="modal">
    <h2>🛒 Coșul tău</h2>
    <div id="cart-items"></div>
    <div class="cart-summary" id="cart-summary"></div>
    <a href="/checkout.html" class="btn-checkout" id="btn-checkout">Finalizează comanda</a>
    <button class="btn-close" onclick="closeCart()">Continuă cumpărăturile</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- AI Assistant FAB -->
<button class="ai-fab" id="ai-fab" onclick="toggleChat()" title="Asistent AI">
  🤖
</button>

<!-- AI Chat Panel -->
<div class="ai-panel" id="ai-panel">
  <div class="ai-header">
    <div>
      <div class="ai-title">🤖 Asistent AI</div>
      <div class="ai-subtitle">Întreabă-mă orice despre produse</div>
    </div>
    <button class="ai-close" onclick="toggleChat()">✕</button>
  </div>

  <div class="ai-messages" id="ai-messages">
    <div class="ai-msg assistant">
      Salut! Sunt asistentul tău de shopping AI. Te pot ajuta să găsești produsul perfect, să compar produse sau să răspund la orice întrebare. Cu ce te pot ajuta? 😊
    </div>
  </div>

  <div class="ai-suggestions" id="ai-suggestions"></div>

  <div class="ai-input-row">
    <input type="text" id="ai-input" placeholder="Scrie un mesaj..." onkeydown="if(event.key==='Enter')sendMessage()" />
    <button id="ai-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<style>
  .ai-fab {
    position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px;
    border-radius: 50%; background: #e94560; color: white; font-size: 1.6rem;
    border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(233,69,96,0.4);
    z-index: 300; transition: transform 0.2s;
  }
  .ai-fab:hover { transform: scale(1.1); }

  .ai-panel {
    position: fixed; bottom: 100px; right: 24px; width: 380px; max-height: 580px;
    background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    display: none; flex-direction: column; z-index: 299; overflow: hidden;
  }
  .ai-panel.open { display: flex; }

  .ai-header {
    background: #1a1a2e; color: white; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .ai-title { font-weight: bold; font-size: 1rem; }
  .ai-subtitle { font-size: 0.75rem; color: #aaa; }
  .ai-close { background: none; border: none; color: white; font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }

  .ai-messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .ai-msg {
    max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; line-height: 1.5;
  }
  .ai-msg.user {
    background: #e94560; color: white; align-self: flex-end; border-bottom-right-radius: 4px;
  }
  .ai-msg.assistant {
    background: #f0f2f5; color: #333; align-self: flex-start; border-bottom-left-radius: 4px;
  }
  .ai-msg.typing { color: #999; font-style: italic; }

  .ai-tool-badge {
    display: inline-block; background: #e8f4fd; color: #1a73e8;
    font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; margin: 2px 2px 6px;
  }

  .ai-suggestions {
    padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .ai-sug-btn {
    background: #f0f2f5; border: none; border-radius: 14px; padding: 5px 12px;
    font-size: 0.78rem; cursor: pointer; color: #444; transition: background 0.2s;
  }
  .ai-sug-btn:hover { background: #e0e3e8; }

  .ai-input-row {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #eee;
  }
  #ai-input {
    flex: 1; padding: 9px 14px; border: 1.5px solid #ddd; border-radius: 20px;
    font-size: 0.9rem; outline: none;
  }
  #ai-input:focus { border-color: #e94560; }
  #ai-send {
    background: #e94560; color: white; border: none; border-radius: 50%;
    width: 38px; height: 38px; cursor: pointer; font-size: 1rem;
  }
  #ai-send:disabled { background: #ccc; }

  @media(max-width: 440px) {
    .ai-panel { width: calc(100vw - 20px); right: 10px; bottom: 90px; }
  }
</style>

<script>
  // ---- AI Assistant ----
  let chatHistory = [];
  let isStreaming = false;

  async function loadSuggestions() {
    try {
      const res = await fetch("/api/assistant/suggestions");
      const suggestions = await res.json();
      const container = document.getElementById("ai-suggestions");
      container.innerHTML = suggestions.slice(0, 3).map(s =>
        `<button class="ai-sug-btn" onclick="useSuggestion('${s.replace(/'/g, "\\'")}')">${s}</button>`
      ).join("");
    } catch {}
  }

  function useSuggestion(text) {
    document.getElementById("ai-input").value = text;
    sendMessage();
  }

  function toggleChat() {
    const panel = document.getElementById("ai-panel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) {
      loadSuggestions();
      document.getElementById("ai-input").focus();
    }
  }

  function appendMessage(role, text, isTyping = false) {
    const container = document.getElementById("ai-messages");
    const div = document.createElement("div");
    div.className = `ai-msg ${role}${isTyping ? " typing" : ""}`;
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  function appendToolBadges(tools) {
    const container = document.getElementById("ai-messages");
    const wrap = document.createElement("div");
    wrap.style.alignSelf = "flex-start";
    tools.forEach(t => {
      const badge = document.createElement("span");
      badge.className = "ai-tool-badge";
      badge.textContent = `🔧 ${t}`;
      wrap.appendChild(badge);
    });
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById("ai-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    document.getElementById("ai-send").disabled = true;
    document.getElementById("ai-suggestions").innerHTML = "";

    appendMessage("user", text);
    chatHistory.push({ role: "user", content: text });

    const typingEl = appendMessage("assistant", "Se gândește...", true);
    isStreaming = true;
    let assistantText = "";
    let assistantEl = null;

    try {
      const res = await fetch("/api/assistant/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chatHistory })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === "text") {
              if (!assistantEl) {
                typingEl.remove();
                assistantEl = appendMessage("assistant", "");
              }
              assistantText += data.text;
              assistantEl.textContent = assistantText;
              document.getElementById("ai-messages").scrollTop = 99999;
            } else if (data.type === "tool_use") {
              appendToolBadges(data.tools);
            } else if (data.type === "done") {
              chatHistory.push({ role: "assistant", content: assistantText });
            } else if (data.type === "error") {
              typingEl.textContent = data.message;
            }
          } catch {}
        }
      }
    } catch (err) {
      typingEl.textContent = "Eroare de conexiune. Încearcă din nou.";
    }

    isStreaming = false;
    document.getElementById("ai-send").disabled = false;
  }
</script>

<script>
  let allProducts = [];
  let activeCategory = "all";
  let cart = JSON.parse(localStorage.getItem("cart") || "[]");

  updateCartCount();

  async function loadProducts() {
    const res = await fetch("/api/products");
    allProducts = await res.json();
    renderCategories();
    applyFilters();
  }

  function renderCategories() {
    const categories = [...new Set(allProducts.map(p => p.category))];
    const container = document.getElementById("filters");
    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      btn.dataset.cat = cat;
      btn.onclick = () => filterBy(cat, btn);
      container.appendChild(btn);
    });
  }

  function filterBy(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyFilters();
  }

  function onSearch() { applyFilters(); }
  function applySort() { applyFilters(); }

  function applyFilters() {
    const query = document.getElementById("search").value.toLowerCase();
    const sort = document.getElementById("sort-select").value;
    let result = allProducts.filter(p => {
      const matchCat = activeCategory === "all" || p.category === activeCategory;
      const matchQ = p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query);
      return matchCat && matchQ;
    });
    if (sort === "price-asc") result.sort((a,b) => a.price - b.price);
    else if (sort === "price-desc") result.sort((a,b) => b.price - a.price);
    else if (sort === "name-asc") result.sort((a,b) => a.name.localeCompare(b.name));
    document.getElementById("results-count").textContent = `${result.length} produs${result.length !== 1 ? "e" : ""}`;
    renderProducts(result);
  }

  function renderProducts(products) {
    const grid = document.getElementById("products-grid");
    if (products.length === 0) {
      grid.innerHTML = '<div class="no-results">Nu am găsit produse.</div>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-img-wrap">
          <a href="/product.html?id=${p.id}">
            <img src="${p.image}" alt="${p.name}" />
          </a>
        </div>
        <div class="card-body">
          <div class="card-category">${p.category}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-footer">
            <span class="card-price">${p.price.toFixed(2)} RON</span>
            <div class="card-actions">
              <a href="/product.html?id=${p.id}" class="btn-detail">Detalii</a>
              <button class="btn-add" id="add-btn-${p.id}" onclick="addToCart(${p.id}, '${p.name.replace(/'/g,"\\'")}', ${p.price})">+ Coș</button>
            </div>
          </div>
        </div>
      </div>`).join("");
  }

  function addToCart(id, name, price) {
    const existing = cart.find(i => i.id === id);
    if (existing) existing.qty++;
    else cart.push({ id, name, price, qty: 1 });
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    showToast(`"${name}" adăugat în coș!`);
    const btn = document.getElementById(`add-btn-${id}`);
    if (btn) {
      btn.classList.add("added");
      btn.textContent = "✓ Adăugat";
      setTimeout(() => { btn.classList.remove("added"); btn.textContent = "+ Coș"; }, 1500);
    }
  }

  function updateCartCount() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById("cart-count").textContent = total;
  }

  function openCart() {
    renderCartModal();
    document.getElementById("cart-modal").classList.add("open");
  }
  function closeCart() {
    document.getElementById("cart-modal").classList.remove("open");
  }

  function renderCartModal() {
    const container = document.getElementById("cart-items");
    const summary = document.getElementById("cart-summary");
    const btnCheckout = document.getElementById("btn-checkout");
    if (cart.length === 0) {
      container.innerHTML = '<div class="empty-cart">Coșul este gol.</div>';
      summary.innerHTML = "";
      btnCheckout.style.display = "none";
      return;
    }
    btnCheckout.style.display = "block";
    container.innerHTML = cart.map(i => `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-qty">x${i.qty}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="cart-item-price">${(i.price * i.qty).toFixed(2)} RON</span>
          <button class="btn-remove" onclick="removeFromCart(${i.id})">✕</button>
        </div>
      </div>`).join("");
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const shipping = subtotal > 500 ? 0 : 25;
    summary.innerHTML = `
      <div class="cart-row"><span>Subtotal</span><span>${subtotal.toFixed(2)} RON</span></div>
      <div class="cart-row"><span>Livrare</span><span>${shipping === 0 ? "Gratuit" : shipping + " RON"}</span></div>
      <div class="cart-row total"><span>Total</span><span>${(subtotal + shipping).toFixed(2)} RON</span></div>`;
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    renderCartModal();
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  loadProducts();
</script>
</body>
</html>
