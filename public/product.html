<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalii Produs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }
    header {
      background: #1a1a2e; color: white; padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header a { color: white; text-decoration: none; font-size: 1.5rem; font-weight: bold; }
    #cart-btn {
      background: #e94560; color: white; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 1rem;
    }
    .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #e94560; text-decoration: none; font-size: 0.95rem; }
    .product-detail {
      background: white; border-radius: 12px; padding: 32px;
      display: flex; gap: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .product-detail img { width: 320px; height: 240px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .product-info { flex: 1; }
    .product-category { color: #e94560; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
    .product-name { font-size: 1.8rem; font-weight: bold; margin-bottom: 12px; }
    .product-desc { color: #666; line-height: 1.6; margin-bottom: 20px; }
    .product-price { font-size: 2rem; font-weight: bold; color: #1a1a2e; margin-bottom: 8px; }
    .product-stock { font-size: 0.9rem; color: #27ae60; margin-bottom: 24px; }
    .qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .qty-btn {
      width: 36px; height: 36px; border: 2px solid #1a1a2e; background: white;
      border-radius: 6px; font-size: 1.2rem; cursor: pointer;
    }
    .qty-input { width: 60px; text-align: center; font-size: 1rem; border: 2px solid #ddd; border-radius: 6px; padding: 6px; }
    .btn-add {
      background: #e94560; color: white; border: none; padding: 14px 28px;
      border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%;
    }
    .btn-add:hover { background: #c73652; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #27ae60; color: white;
      padding: 12px 24px; border-radius: 8px; font-size: 0.95rem;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media(max-width: 600px) {
      .product-detail { flex-direction: column; }
      .product-detail img { width: 100%; }
    }
  </style>
</head>
<body>
<header>
  <a href="/">🛒 E-Commerce Shop</a>
  <button id="cart-btn" onclick="window.location.href='/checkout.html'">Coș (<span id="cart-count">0</span>)</button>
</header>
<div class="container">
  <a href="/" class="back-link">← Înapoi la produse</a>
  <div class="product-detail" id="product-detail">
    <p>Se încarcă...</p>
  </div>
</div>
<div class="toast" id="toast">Produs adăugat în coș!</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  let cart = JSON.parse(localStorage.getItem("cart") || "[]");
  updateCartCount();

  async function loadProduct() {
    const res = await fetch(`/api/products/${id}`);
    if (!res.ok) {
      document.getElementById("product-detail").innerHTML = "<p>Produs negăsit.</p>";
      return;
    }
    const p = await res.json();
    document.title = p.name;
    document.getElementById("product-detail").innerHTML = `
      <img src="${p.image}" alt="${p.name}" />
      <div class="product-info">
        <div class="product-category">${p.category}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.description}</div>
        <div class="product-price">${p.price.toFixed(2)} RON</div>
        <div class="product-stock">✓ În stoc (${p.stock} disponibile)</div>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <input class="qty-input" id="qty" type="number" value="1" min="1" max="${p.stock}" />
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <button class="btn-add" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">+ Adaugă în coș</button>
      </div>`;
  }

  function changeQty(delta) {
    const input = document.getElementById("qty");
    input.value = Math.max(1, parseInt(input.value) + delta);
  }

  function addToCart(id, name, price) {
    const qty = parseInt(document.getElementById("qty").value);
    const existing = cart.find(i => i.id === id);
    if (existing) existing.qty += qty;
    else cart.push({ id, name, price, qty });
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    showToast();
  }

  function updateCartCount() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById("cart-count").textContent = total;
  }

  function showToast() {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  loadProduct();
</script>
</body>
</html>
